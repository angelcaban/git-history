# Runs the image that ./build.sh builds (git-history-page:latest).
#
#   ./build.sh
#   docker compose up -d
#
# Settings come from the environment or a .env file next to this file, e.g.
#   HOST_PORT=8080 ALLOWED_GIT_HOSTS=github.com,bitbucket.org docker compose up -d
services:
  app:
    image: git-history-page:latest
    pull_policy: never
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # Comma-separated hosts that repository URLs may point at; empty allows any host.
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-}
      REPO_REFRESH_SECONDS: ${REPO_REFRESH_SECONDS:-60}
      GIT_TIMEOUT_SECONDS: ${GIT_TIMEOUT_SECONDS:-120}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10485760}
      # file:// URLs read the container's filesystem; leave off unless you mount repositories.
      ALLOW_FILE_URLS: ${ALLOW_FILE_URLS:-false}
    volumes:
      # Bare clones of browsed repositories, kept across restarts and upgrades.
      - repos:/data/repos
    healthcheck:
      # busybox wget ships with Alpine; / returns the client page once the server is up.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 120s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  repos:
