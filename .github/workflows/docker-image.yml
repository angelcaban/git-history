name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/git-history-page', vars.DOCKERHUB_USERNAME) }}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: ./build.sh

    # Publishing runs only for pushes to main (i.e. merged PRs), never for pull_request runs.
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push the Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag git-history-page "$IMAGE_NAME:latest"
        docker tag git-history-page "$IMAGE_NAME:${GITHUB_SHA::12}"
        docker push "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:${GITHUB_SHA::12}"
